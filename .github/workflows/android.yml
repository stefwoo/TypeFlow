name: Build and Release

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: 8.2

      - name: Create keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/.android
          echo "$KEYSTORE_BASE64" | base64 -d > ~/.android/typeflow.keystore

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: typeflow-debug
          path: app/build/outputs/apk/debug/typeflow-debug.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: typeflow-release
          path: app/build/outputs/apk/release/typeflow-release.apk

  go:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [windows, linux, darwin]
        goarch: [amd64]
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Tidy dependencies
        working-directory: cmd/server
        run: |
          go mod tidy

      - name: Build
        working-directory: cmd/server
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          EXT=""
          LDFLAGS=""
          if [ "$GOOS" = "windows" ]; then
            EXT=".exe"
            LDFLAGS="-H=windowsgui"
          fi
          OUTPUT_NAME="typeflow-${GOOS}-${GOARCH}${EXT}"
          go build -ldflags="$LDFLAGS" -o "$OUTPUT_NAME" .

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: typeflow-${{ matrix.goos }}-${{ matrix.goarch }}
          path: cmd/server/typeflow-*

  release:
    needs: [android, go]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate Release Notes
        id: release-notes
        run: |
          cat > release-notes.md << 'EOF'
          ## TypeFlow v1.0

          手机语音转电脑文字输入神器

          ### 下载说明

          - Windows: 下载 `typeflow-windows-amd64.exe`
          - Linux: 下载 `typeflow-linux-amd64`
          - macOS: 下载 `typeflow-darwin-amd64`
          - Android: 下载 `typeflow-release.apk`

          ### 更新内容

          - 首个正式版本
          EOF
          cat release-notes.md

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd artifacts
          
          # Rename files for release
          cp typeflow-windows-amd64/typeflow-windows-amd64.exe ../typeflow-windows-amd64.exe
          cp typeflow-linux-amd64/typeflow-linux-amd64 ../typeflow-linux-amd64
          cp typeflow-darwin-amd64/typeflow-darwin-amd64 ../typeflow-darwin-amd64
          cp typeflow-release/typeflow-release.apk ../typeflow-release.apk
          cd ..
          
          # Create release with gh CLI
          gh release create v1.0 \
            --title "TypeFlow v1.0" \
            --notes-file release-notes.md \
            typeflow-windows-amd64.exe \
            typeflow-linux-amd64 \
            typeflow-darwin-amd64 \
            typeflow-release.apk
